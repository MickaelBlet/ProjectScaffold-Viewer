      width: 200
      height: 122
    Vcu.Inverter:
      x: 783
      y: 330
      width: 200
      height: 98
    Vcu.Bms:
      x: 781
      y: 144
      width: 200
      height: 116
    Vcu.Dem:
      x: 153
      y: 334
      width: 200
      height: 72
    Esc:
      x: 20
      y: 34
      width: 443
      height: 306
    Esc.WheelSensors:
      x: 99
      y: 188
      width: 200
      height: 98
    Esc.Hydraulics:
      x: 101
      y: 46
      width: 200
      height: 72
