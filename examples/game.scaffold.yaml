    Engine.System:
      x: 289
      y: 1340
      width: 200
      height: 160
    Engine.World:
      x: 289
      y: 188
      width: 200
      height: 196
    Engine.Systems:
      x: 140
      y: 596
      width: 499
      height: 674
    Engine.Systems.Player:
      x: 187
      y: 488
      width: 200
      height: 166
    Engine.Systems.Physics:
      x: 187
      y: 258
      width: 200
      height: 160
    Engine.Systems.Sprites:
      x: 187
