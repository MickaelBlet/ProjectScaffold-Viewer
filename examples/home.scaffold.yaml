schemaVersion: 1
project:
  name: Home
  description: Home automation split into binaries talking over every built-in transport (ipc, shm, tcp, udp, http, grpc, websocket, mqtt, can, serial) and a custom one
transports:
  - zigbee
remoteDefaults:
  client:
    host: hub.local
  server:
    host: 0.0.0.0
  basePort: 52000
binaries:
  - name: Hub
    description: Home server process
    color: "#2e9e8f"
  - name: Vision
    description: Camera process on the hub box
    color: "#8a4fd1"
  - name: Voice
    description: Speech assistant process on the hub box
    color: "#d14f9e"
  - name: Cloud
    description: Remote service
    color: "#3b8fd1"
  - name: Mobile
    description: Phone app
    color: "#d6c21f"
  - name: Firmware
    description: Microcontrollers of the devices
    color: "#d1733b"
types:
  - kind: alias
    name: DeviceId
    type:
      kind: primitive
      name: string
      max: 16
  - kind: enum
    name: Quantity
    underlying: uint8
    values:
      - name: Temperature
        value: 0
      - name: Humidity
        value: 1
      - name: Motion
        value: 2
      - name: Door
        value: 3
      - name: Power
        value: 4
  - kind: struct
    name: Reading
    fields:
      - name: device
        type:
          kind: ref
          name: DeviceId
      - name: quantity
        type:
          kind: ref
          name: Quantity
      - name: value
        type:
          kind: primitive
          name: float32
      - name: stampMs
        type:
          kind: primitive
          name: uint64
  - kind: struct
    name: Frame
    fields:
      - name: camera
        type:
          kind: ref
          name: DeviceId
      - name: jpeg
        type:
          kind: primitive
          name: bytes
  - kind: struct
    name: Event
    fields:
      - name: title
        type:
          kind: primitive
          name: string
          max: 64
      - name: device
        type:
          kind: optional
          of:
            kind: ref
            name: DeviceId
        default: null
      - name: snapshot
        type:
          kind: optional
          of:
            kind: ref
            name: Frame
        default: null
  - kind: struct
    name: Rule
    fields:
      - name: name
        type:
          kind: primitive
          name: string
          max: 32
      - name: when
        type:
          kind: primitive
          name: string
        description: Condition on readings
      - name: then
        type:
          kind: vector
          of:
            kind: primitive
            name: string
        description: Commands to run
      - name: enabled
        type:
          kind: primitive
          name: bool
        default: true
  - kind: struct
    name: Intent
    fields:
      - name: verb
        type:
          kind: primitive
          name: string
          max: 24
      - name: target
        type:
          kind: ref
          name: DeviceId
      - name: value
        type:
          kind: optional
          of:
            kind: primitive
            name: float32
        default: null
interfaces:
  - name: Readings
    messages:
      - name: report
        params:
          - name: reading
            type:
              kind: ref
              name: Reading
        returns: null
  - name: Switch
    messages:
      - name: set
        params:
          - name: on
            type:
              kind: primitive
              name: bool
          - name: level
            type:
              kind: primitive
              name: uint8
            description: 0-100
        returns: null
  - name: Climate
    messages:
      - name: setTarget
        params:
          - name: celsius
            type:
              kind: primitive
              name: float32
        returns:
          kind: primitive
          name: bool
      - name: current
        params: []
        returns:
          kind: ref
          name: Reading
  - name: Frames
    messages:
      - name: push
        params:
          - name: frame
            type:
              kind: ref
              name: Frame
        returns: null
  - name: Intents
    messages:
      - name: intent
        params:
          - name: intent
            type:
              kind: ref
              name: Intent
        returns:
          kind: primitive
          name: string
  - name: Events
    messages:
      - name: notify
        params:
          - name: event
            type:
              kind: ref
              name: Event
        returns: null
  - name: Rules
    messages:
      - name: list
        params: []
        returns:
          kind: vector
          of:
            kind: ref
            name: Rule
      - name: upsert
        params:
          - name: rule
            type:
              kind: ref
              name: Rule
        returns: null
  - name: Backup
    messages:
      - name: upload
        params:
          - name: name
            type:
              kind: primitive
              name: string
          - name: data
            type:
              kind: primitive
              name: bytes
        returns: null
  - name: Presence
    description: Devices announcing themselves on the network
    messages:
      - name: hello
        params:
          - name: device
            type:
              kind: ref
              name: DeviceId
        returns: null
modules:
  - name: Automation
    description: Runs the rules on the readings
    color: "#2e9e8f"
    binary: Hub
    ports:
      - name: readings
        role: in
        interface: Readings
      - name: frames
        role: in
        interface: Frames
      - name: intents
        role: in
        interface: Intents
      - name: presence
        role: in
        interface: Presence
      - name: lights
        role: out
        interface: Switch
      - name: heating
        role: out
        interface: Climate
      - name: events
        role: out
        interface: Events
      - name: rules
        role: out
        interface: Rules
      - name: backup
        role: out
        interface: Backup
  - name: Camera
    color: "#8a4fd1"
    binary: Vision
    attributes:
      - name: fps
        type:
          kind: primitive
          name: uint8
        default: 10
    ports:
      - name: frames
        role: out
        interface: Frames
  - name: Assistant
    color: "#d14f9e"
    binary: Voice
    attributes:
      - name: wakeWord
        type:
          kind: primitive
          name: string
        default: hey home
    ports:
      - name: intents
        role: out
        interface: Intents
  - name: Service
    description: Stores rules and events, sends notifications
    color: "#3b8fd1"
    binary: Cloud
    ports:
      - name: events
        role: in
        interface: Events
      - name: rules
        role: in
        interface: Rules
      - name: backup
        role: in
        interface: Backup
      - name: push
        role: out
        interface: Events
  - name: App
    color: "#d6c21f"
    binary: Mobile
    ports:
      - name: rules
        role: out
        interface: Rules
      - name: events
        role: in
        interface: Events
  - name: Sensors
    description: Battery sensors on the Zigbee mesh
    color: "#d1733b"
    binary: Firmware
    ports:
      - name: readings
        role: out
        interface: Readings
  - name: Lights
    color: "#d1733b"
    binary: Firmware
    ports:
      - name: switch
        role: in
        interface: Switch
  - name: Boiler
    description: Boiler controller wired to the hub
    color: "#d1733b"
    binary: Firmware
    ports:
      - name: climate
        role: in
        interface: Climate
      - name: meter
        role: out
        interface: Readings
  - name: Doorbell
    color: "#d1733b"
    binary: Firmware
    ports:
      - name: presence
        role: out
        interface: Presence
links:
  - name: camera_frames
    description: Same box, large payloads
    from:
      module: Camera
      port: frames
    to:
      module: Automation
      port: frames
    constraints:
      direction: unidirectional
      ack:
        required: false
      performance:
        class: realtime
        maxLatencyMs: 20
        rateHz: 10
      remote:
        enabled: true
        transport: shm
        settings:
          name: home_frames
          capacity: 8388608
  - name: voice_intents
    from:
      module: Assistant
      port: intents
    to:
      module: Automation
      port: intents
    constraints:
      direction: bidirectional
      ack:
        required: false
      performance:
        class: normal
        maxLatencyMs: 300
      remote:
        enabled: true
        transport: ipc
        settings:
          socket: /run/home/intents.sock
  - name: sensor_readings
    from:
      module: Sensors
      port: readings
    to:
      module: Automation
      port: readings
    constraints:
      direction: unidirectional
      ack:
        required: false
      performance:
        class: low
      remote:
        enabled: true
        transport: zigbee
        settings:
          options:
            channel: "15"
            panId: "0x1A62"
            coordinator: /dev/ttyACM0
  - name: light_switch
    from:
      module: Automation
      port: lights
    to:
      module: Lights
      port: switch
    constraints:
      direction: bidirectional
      ack:
        required: true
        timeoutMs: 1000
      performance:
        class: normal
      remote:
        enabled: true
        transport: mqtt
        settings:
          broker:
            host: hub.local
            port: 1883
          topic: home/lights/set
  - name: boiler_control
    from:
      module: Automation
      port: heating
    to:
      module: Boiler
      port: climate
    constraints:
      direction: bidirectional
      ack:
        required: true
        timeoutMs: 500
      performance:
        class: low
      remote:
        enabled: true
        transport: serial
        settings:
          device: /dev/ttyUSB0
          baud: 115200
  - name: boiler_meter
    from:
      module: Boiler
      port: meter
    to:
      module: Automation
      port: readings
    constraints:
      direction: unidirectional
      ack:
        required: false
      performance:
        class: low
        rateHz: 1
      remote:
        enabled: true
        transport: can
        settings:
          interface: can0
          id: 291
  - name: doorbell_presence
    from:
      module: Doorbell
      port: presence
    to:
      module: Automation
      port: presence
    constraints:
      direction: unidirectional
      ack:
        required: false
      performance:
        class: low
      remote:
        enabled: true
        transport: udp
        settings:
          server:
            port: 52100
  - name: cloud_events
    from:
      module: Automation
      port: events
    to:
      module: Service
      port: events
    constraints:
      direction: bidirectional
      ack:
        required: true
        timeoutMs: 5000
      performance:
        class: normal
      remote:
        enabled: true
        transport: grpc
        settings:
          client:
            host: api.home.example
            port: 443
          server:
            port: 8443
  - name: cloud_rules
    description: Address from remoteDefaults
    from:
      module: Automation
      port: rules
    to:
      module: Service
      port: rules
    constraints:
      direction: bidirectional
      ack:
        required: false
      performance:
        class: low
      remote:
        enabled: true
        transport: tcp
  - name: cloud_backup
    from:
      module: Automation
      port: backup
    to:
      module: Service
      port: backup
    constraints:
      direction: bidirectional
      ack:
        required: true
        timeoutMs: 60000
      performance:
        class: bulk
      remote:
        enabled: true
        transport: http
        settings:
          client:
            host: api.home.example
            port: 443
          path: /v1/backup
  - name: app_rules
    from:
      module: App
      port: rules
    to:
      module: Service
      port: rules
    constraints:
      direction: bidirectional
      ack:
        required: false
      performance:
        class: normal
      remote:
        enabled: true
        transport: http
        settings:
          client:
            host: api.home.example
            port: 443
          path: /v1/rules
  - name: app_events
    from:
      module: Service
      port: push
    to:
      module: App
      port: events
    constraints:
      direction: unidirectional
      ack:
        required: false
      performance:
        class: normal
      remote:
        enabled: true
        transport: websocket
        settings:
          server:
            port: 8444
          path: /v1/live
editor:
  layout:
    Automation:
      x: 336
      y: 211
      width: 200
      height: 168
    Camera:
      x: 20
      y: 162
      width: 200
      height: 98
    Assistant:
      x: 20
      y: 330
      width: 200
      height: 98
    Service:
      x: 652
      y: 377
      width: 200
      height: 120
    App:
      x: 968
      y: 259
      width: 200
      height: 72
    Sensors:
      x: 20
      y: 20
      width: 200
      height: 72
    Lights:
      x: 652
      y: 93
      width: 200
      height: 72
    Boiler:
      x: 652
      y: 235
      width: 200
      height: 72
    Doorbell:
      x: 20
      y: 498
      width: 200
      height: 72
