schemaVersion: 1
project:
  name: Robot
  description: Mobile robot control stack
  metadata:
    version: 0.1.0
types:
  - kind: primitive
    name: Primitive
interfaces: []
modules:
  - name: Core
    metadata:
      owner: team-a
    color: "#2e9e8f"
    ports:
      - name: control
        role: in
        interface: Control
    modules:
      - name: Sensor
        color: "#8a4fd1"
        attributes:
          - name: rateHz
            type:
              kind: primitive
              name: float32
            default: 50
          - name: maxRateHz
            static: true
            const: true
            type:
              kind: primitive
              name: float32
            default: 200
        ports:
          - name: out
            role: out
            interface: Telemetry
      - name: Controller
        color: "#d14f9e"
        attributes:
          - name: mode
            type:
              kind: ref
              name: Mode
            default: Idle
        methods:
          - name: setMode
            description: Switch mode, false when the transition is not allowed
            params:
              - name: mode
                type:
                  kind: ref
                  name: Mode
                const: true
            returns:
              kind: primitive
              name: bool
          - name: reset
            params: []
            returns: null
          - name: isRunning
            const: true
            params: []
            returns:
              kind: primitive
              name: bool
          - name: instances
            description: Number of controllers alive
            static: true
            params: []
            returns:
              kind: primitive
              name: uint32
        ports:
          - name: telemetry
            role: in
            interface: Telemetry
      - name: Logger
        color: "#3b8fd1"
        ports:
          - name: in
            role: in
            interface: Telemetry
  - name: Operator
    description: Remote operator console
    color: "#d6c21f"
    ports:
      - name: cmd
        role: out
        interface: Control
links:
  - name: sensor_to_controller
    from:
      module: Core.Sensor
      port: out
    to:
      module: Core.Controller
      port: telemetry
    constraints:
      direction: unidirectional
      ack:
        required: false
      performance:
        class: realtime
        maxLatencyMs: 1
        rateHz: 1000
      remote:
        enabled: false
  - name: sensor_to_logger
    from:
      module: Core.Sensor
      port: out
    to:
      module: Core.Logger
      port: in
    constraints:
      direction: unidirectional
      ack:
        required: false
      performance:
        class: bulk
      remote:
        enabled: false
  - name: operator_to_core
    from:
      module: Operator
      port: cmd
    to:
      module: Core
      port: control
    constraints:
      direction: bidirectional
      ack:
        required: false
      performance:
        class: normal
        maxLatencyMs: 50
      remote:
        enabled: true
        transport: tcp
dependencies:
  - name: Common
    file: common.scaffold.yaml
    types:
      - kind: struct
        name: Vec3
        fields:
          - name: x
            type:
              kind: primitive
              name: float32
          - name: y
            type:
              kind: primitive
              name: float32
          - name: z
            type:
              kind: primitive
              name: float32
      - kind: enum
        name: Mode
        underlying: uint8
        values:
          - name: Idle
            value: 0
          - name: Run
            value: 1
          - name: Fault
            value: 255
      - kind: alias
        name: Samples
        type:
          kind: vector
          of:
            kind: primitive
            name: uint16
      - kind: struct
        name: Pose
        description: Position and orientation
        fields:
          - name: position
            type:
              kind: ref
              name: Vec3
          - name: orientation
            type:
              kind: array
              of:
                kind: primitive
                name: float64
              size: 4
            default:
              - 0
              - 0
              - 0
              - 1
    interfaces:
      - name: Telemetry
        messages:
          - name: publish
            params:
              - name: pose
                type:
                  kind: ref
                  name: Pose
              - name: tags
                type:
                  kind: map
                  key:
                    kind: primitive
                    name: string
                  value:
                    kind: list
                    of:
                      kind: primitive
                      name: uint8
            returns: null
      - name: Control
        messages:
          - name: setMode
            params:
              - name: mode
                type:
                  kind: ref
                  name: Mode
            returns:
              kind: primitive
              name: bool
          - name: raw
            params:
              - name: samples
                type:
                  kind: ref
                  name: Samples
                direction: inout
              - name: gain
                type:
                  kind: optional
                  of:
                    kind: primitive
                    name: float32
            returns: null
editor:
  layout:
    Core:
      x: 200
      y: -60
      width: 700
      height: 420
    Core.Sensor:
      x: 100
      y: 120
      width: 260
      height: 280
    Core.Controller:
      x: 460
      y: 40
      width: 220
      height: 240
    Core.Logger:
      x: 460
      y: 320
      width: 200
      height: 80
    Operator:
      x: -100
      y: -60
      width: 200
      height: 220
  views:
    - name: Operator
      root: Operator
