schemaVersion: 1
project:
  name: Sdk
  description: Plugin SDK of an image editor - the abstract Plugin module that plugins of other projects derive from, and the Host loading them
  metadata:
    version: 3.1.0
types:
  - kind: struct
    name: Version
    fields:
      - name: major
        type:
          kind: primitive
          name: uint16
      - name: minor
        type:
          kind: primitive
          name: uint16
      - name: patch
        type:
          kind: primitive
          name: uint16
        default: 0
  - kind: enum
    name: Level
    underlying: uint8
    values:
      - name: Debug
        value: 0
      - name: Info
        value: 1
      - name: Warning
        value: 2
      - name: Error
        value: 3
  - kind: struct
    name: Image
    fields:
      - name: width
        type:
          kind: primitive
          name: uint16
      - name: height
        type:
          kind: primitive
          name: uint16
      - name: rgba
        type:
          kind: primitive
          name: bytes
interfaces:
  - name: Log
    messages:
      - name: write
        params:
          - name: level
            type:
              kind: ref
              name: Level
          - name: text
            type:
              kind: primitive
              name: string
        returns: null
  - name: ImageFilter
    messages:
      - name: apply
        params:
          - name: image
            type:
              kind: ref
              name: Image
            direction: inout
        returns: null
constants:
  - name: ApiVersion
    type:
      kind: ref
      name: Version
    value:
      major: 3
      minor: 1
modules:
  - name: Plugin
    description: Base of every plugin
    kind: abstract
    color: "#8a4fd1"
    types:
      - kind: struct
        name: Info
        fields:
          - name: name
            type:
              kind: primitive
              name: string
              max: 32
          - name: version
            type:
              kind: ref
              name: Version
          - name: author
            type:
              kind: optional
              of:
                kind: primitive
                name: string
            default: null
      - kind: alias
        name: Settings
        type:
          kind: map
          key:
            kind: primitive
            name: string
          value:
            kind: primitive
            name: string
    methods:
      - name: info
        const: true
        virtual: true
        pure: true
        params: []
        returns:
          kind: ref
          name: Plugin.Info
      - name: load
        virtual: true
        pure: true
        params:
          - name: settings
            type:
              kind: ref
              name: Plugin.Settings
            const: true
        returns:
          kind: primitive
          name: bool
      - name: unload
        description: Does nothing unless overridden
        virtual: true
        params: []
        returns: null
    ports: []
  - name: Host
    description: Loads the plugins and runs them on images
    color: "#2e9e8f"
    attributes:
      - name: directory
        type:
          kind: primitive
          name: string
        default: plugins
    ports:
      - name: log
        role: in
        interface: Log
      - name: filter
        role: out
        interface: ImageFilter
links: []
editor:
  layout:
    Plugin:
      x: 20
      y: 20
      width: 200
      height: 134
    Host:
      x: 20
      y: 224
      width: 200
      height: 98
