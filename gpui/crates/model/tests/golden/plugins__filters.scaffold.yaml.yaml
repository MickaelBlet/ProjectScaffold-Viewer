schemaVersion: 1
project:
  name: Filters
  description: Plugins deriving from the Plugin module of the SDK (placed on the canvas), linked to its Host
types: []
interfaces: []
modules:
  - name: Blur
    bases:
      - Sdk/Plugin
    color: "#3b8fd1"
    attributes:
      - name: radius
        type:
          kind: primitive
          name: float32
        default: 2
    methods:
      - name: info
        const: true
        virtual: true
        override: true
        params: []
        returns:
          kind: ref
          name: Sdk/Plugin.Info
      - name: load
        virtual: true
        override: true
        params:
          - name: settings
            type:
              kind: ref
              name: Sdk/Plugin.Settings
            const: true
        returns:
          kind: primitive
          name: bool
    ports:
      - name: apply
        role: in
        interface: ImageFilter
      - name: log
        role: out
        interface: Log
  - name: Sharpen
    bases:
      - Sdk/Plugin
    color: "#d14f9e"
    attributes:
      - name: amount
        type:
          kind: primitive
          name: float32
        default: 0.5
    methods:
      - name: info
        const: true
        virtual: true
        override: true
        params: []
        returns:
          kind: ref
          name: Sdk/Plugin.Info
      - name: load
        virtual: true
        override: true
        params:
          - name: settings
            type:
              kind: ref
              name: Sdk/Plugin.Settings
            const: true
        returns:
          kind: primitive
          name: bool
      - name: unload
        virtual: true
        override: true
        params: []
        returns: null
    ports:
      - name: apply
        role: in
        interface: ImageFilter
      - name: log
        role: out
        interface: Log
links:
  - name: host_blur
    from:
      project: Sdk
      module: Host
      port: filter
    to:
      module: Blur
      port: apply
    constraints:
      direction: bidirectional
      ack:
        required: false
      performance:
        class: normal
      remote:
        enabled: false
  - name: host_sharpen
    from:
      project: Sdk
      module: Host
      port: filter
    to:
      module: Sharpen
      port: apply
    constraints:
      direction: bidirectional
      ack:
        required: false
      performance:
        class: normal
      remote:
        enabled: false
  - name: blur_log
    from:
      module: Blur
      port: log
    to:
      project: Sdk
      module: Host
      port: log
    constraints:
      direction: unidirectional
      ack:
        required: false
      performance:
        class: low
      remote:
        enabled: false
  - name: sharpen_log
    from:
      module: Sharpen
      port: log
    to:
      project: Sdk
      module: Host
      port: log
    constraints:
      direction: unidirectional
      ack:
        required: false
      performance:
        class: low
      remote:
        enabled: false
dependencies:
  - name: Sdk
    file: sdk.scaffold.yaml
    types:
      - kind: struct
        name: Version
        fields:
          - name: major
            type:
              kind: primitive
              name: uint16
          - name: minor
            type:
              kind: primitive
              name: uint16
          - name: patch
            type:
              kind: primitive
              name: uint16
            default: 0
      - kind: struct
        name: Image
        fields:
          - name: width
            type:
              kind: primitive
              name: uint16
          - name: height
            type:
              kind: primitive
              name: uint16
          - name: rgba
            type:
              kind: primitive
              name: bytes
      - kind: enum
        name: Level
        underlying: uint8
        values:
          - name: Debug
            value: 0
          - name: Info
            value: 1
          - name: Warning
            value: 2
          - name: Error
            value: 3
    interfaces:
      - name: Log
        messages:
          - name: write
            params:
              - name: level
                type:
                  kind: ref
                  name: Level
              - name: text
                type:
                  kind: primitive
                  name: string
            returns: null
      - name: ImageFilter
        messages:
          - name: apply
            params:
              - name: image
                type:
                  kind: ref
                  name: Image
                direction: inout
            returns: null
    constants:
      - name: ApiVersion
        type:
          kind: ref
          name: Version
        value:
          major: 3
          minor: 1
    moduleTypes:
      - module: Plugin
        types:
          - kind: struct
            name: Info
            fields:
              - name: name
                type:
                  kind: primitive
                  name: string
                  max: 32
              - name: version
                type:
                  kind: ref
                  name: Version
              - name: author
                type:
                  kind: optional
                  of:
                    kind: primitive
                    name: string
                default: null
          - kind: alias
            name: Settings
            type:
              kind: map
              key:
                kind: primitive
                name: string
              value:
                kind: primitive
                name: string
    modules:
      - module: Plugin
        methods:
          - name: info
            const: true
            virtual: true
            pure: true
            params: []
            returns:
              kind: ref
              name: Sdk/Plugin.Info
          - name: load
            virtual: true
            pure: true
            params:
              - name: settings
                type:
                  kind: ref
                  name: Sdk/Plugin.Settings
                const: true
            returns:
              kind: primitive
              name: bool
          - name: unload
            description: Does nothing unless overridden
            virtual: true
            params: []
            returns: null
        ports: []
      - module: Host
        attributes:
          - name: directory
            type:
              kind: primitive
              name: string
            default: plugins
        ports:
          - name: log
            role: in
            interface: Log
          - name: filter
            role: out
            interface: ImageFilter
editor:
  layout:
    Blur:
      x: 20
      y: 20
      width: 200
      height: 142
    Sharpen:
      x: 20
      y: 232
      width: 200
      height: 160
  dependencies:
    Sdk:
      Plugin:
        x: 20
        y: 439
      Host:
        x: 336
        y: 247
