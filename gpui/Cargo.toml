[workspace]
resolver = "2"
members = ["crates/model", "crates/layout", "crates/app"]

[workspace.package]
version = "1.1.1"
edition = "2024"
license = "MIT"
authors = ["Mickaël Blet"]

[workspace.dependencies]
scaffold-model = { path = "crates/model" }
scaffold-layout = { path = "crates/layout" }
gpui-kit = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }

[profile.dev.package."*"]
opt-level = 2

[workspace.lints.clippy]
# Nested conditions follow the structure of the TypeScript model they port.
collapsible_if = "allow"
