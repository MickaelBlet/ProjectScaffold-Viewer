[package]
name = "project-scaffold"
version = "0.1.0"
description = "Software architecture editor exporting YAML/JSON for code skeleton generators"
authors = ["Mickaël Blet"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
strip = true
