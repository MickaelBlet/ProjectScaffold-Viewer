appId: com.mickaelblet.projectscaffold
productName: ProjectScaffold
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
fileAssociations:
  - ext: [yaml, yml, json]
    name: ProjectScaffold architecture
    role: Editor
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
linux:
  category: Development
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
appImage:
  artifactName: ${productName}-${version}.${ext}
